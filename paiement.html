<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexloc – Paiement</title>
  <script src="config.js"></script>
  <style>
    :root { --noir: #000; --blanc: #fff; --texte: #1a1a1f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texte); background: var(--blanc); min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
    .boite { max-width: 380px; }
    .rond { width: 34px; height: 34px; margin: 0 auto 18px; border: 4px solid #e3e3e8; border-top-color: var(--noir); border-radius: 50%; animation: tourne .8s linear infinite; }
    @keyframes tourne { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; margin-bottom: 6px; }
    p { color: #666; }
    .secours { margin-top: 22px; }
    .secours[hidden] { display: none; }
    .btn { display: inline-block; margin-top: 8px; background: var(--noir); color: var(--blanc); text-decoration: none; padding: 13px 26px; border-radius: 999px; font-weight: 700; }
    .retour { display: inline-block; margin-top: 16px; color: #888; font-size: .92rem; text-decoration: none; }
  </style>
</head>
<body>
  <div class="boite">
    <div class="rond" aria-hidden="true"></div>
    <h1 id="titre">Redirection vers le paiement sécurisé…</h1>
    <p id="detail">Encaissé par Whop.</p>
    <div class="secours" id="secours" hidden>
      <p>Rien ne se passe ?</p>
      <a class="btn" id="lien" href="#">Ouvrir le paiement</a><br>
      <a class="retour" href="offre.html">← Retour aux formules</a>
    </div>
  </div>

  <script>
    (function () {
      // Page de passage : crée la session de paiement puis envoie directement sur la page de paiement Whop.
      // Appelée avec par exemple  paiement.html#annuel-promo  ou  paiement.html#pack
      var PLANS = {
        'mensuel-promo': 'plan_l8Ho8AsUgnNqH',   'mensuel-base': 'plan_yekjjKeON7EG1',
        'trimestriel-promo': 'plan_VX46TUeYgLP7Y', 'trimestriel-base': 'plan_Jv5U42Qet3Ukp',
        'annuel-promo': 'plan_bDttClAnGqFe4',    'annuel-base': 'plan_fknTbKiPlD7vs',
        'pack': 'plan_itUEtYdVwjh27'
      };
      var cfgIl = (window.FLEXLOC_SUPABASE || {}).planIllimite; if (cfgIl) PLANS.illimite = cfgIl;
      var items = location.hash.slice(1).split('+').filter(function (k) { return PLANS[k]; });
      if (!items.length) { location.replace('offre.html'); return; }

      var cle = items[0], suite = items[1] || '';
      var secoursUrl = 'https://whop.com/checkout/' + PLANS[cle] + '/';
      document.getElementById('lien').href = secoursUrl;
      setTimeout(function () { document.getElementById('secours').hidden = false; }, 6000);

      function aller(url) { location.replace(url); }

      function demarrer() {
        var a = window.flexlocAuth;
        if (!a || !a.configure) { aller(secoursUrl); return; }
        a.email().then(function (email) {
          if (!email) { location.replace('connexion.html'); return; }
          a.creerPaiement(cle, suite).then(function (r) {
            if (r && r.purchase_url) aller(r.purchase_url);
            else { console.warn('Session de paiement non créée :', r && r.erreur); aller(secoursUrl); }
          });
        });
      }
      if (document.readyState === 'complete') demarrer(); else window.addEventListener('load', demarrer);
    })();
  </script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
