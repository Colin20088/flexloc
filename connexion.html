<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Flexloc.io">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e11d2a" media="(max-width: 640px)">
  <title>Flexloc – Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&display=swap" rel="stylesheet">
  <style>
    :root { --noir: #000; --blanc: #fff; --texte: #1a1a1f; --jaune: #f5ff4f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--texte); background: var(--blanc); line-height: 1.6; min-height: 100vh;
    }

    /* Barre de navigation noire */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: rgba(0, 0, 0, .88);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      color: var(--blanc);
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 20px;
      height: 64px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; letter-spacing: .5px; color: var(--blanc); text-decoration: none; }
    .nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
    .nav-links a { color: #ddd; text-decoration: none; font-size: .95rem; }
    .nav-cta { background: var(--blanc); color: var(--noir) !important; padding: 8px 18px; border-radius: 999px; font-weight: 600; }
    .alerte { display: none; background: #e11d2a; color: #fff; text-align: center; font-size: .85rem; font-weight: 700; height: 32px; line-height: 32px; }

    main {
      min-height: 100vh; padding: 150px 20px 80px; text-align: center;
      background: radial-gradient(circle at 50% 0%, #ece9ff 0%, #fff 65%);
    }
    h1 {
      font-family: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 800; letter-spacing: -.03em; line-height: 1.1;
      font-size: clamp(2.1rem, 6vw, 3.4rem); max-width: 700px; margin: 0 auto 32px;
    }

    form { max-width: 460px; margin: 0 auto; display: grid; gap: 14px; }
    input {
      width: 100%; padding: 17px 24px; font: inherit; font-size: 1.05rem;
      border: 1px solid #dcdce3; border-radius: 999px; background: var(--blanc);
      box-shadow: 0 4px 24px rgba(0,0,0,.07); outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #a3a3ad; }
    input:focus { border-color: var(--noir); box-shadow: 0 4px 24px rgba(0,0,0,.14); }
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--noir); color: var(--blanc); border: 0; cursor: pointer; font: inherit;
      padding: 17px 34px; border-radius: 999px; font-weight: 700; font-size: 1.05rem;
      transition: transform .15s;
    }
    button:hover { transform: translateY(-2px); }
    button svg { flex-shrink: 0; }

    .autre { max-width: 460px; margin: 0 auto; }
    .ou { display: flex; align-items: center; gap: 14px; margin: 22px 0; color: #999; font-size: .9rem; }
    .ou::before, .ou::after { content: ""; flex: 1; height: 1px; background: #dcdce3; }
    .btn-google {
      width: 100%; background: var(--blanc); color: var(--noir);
      border: 1px solid var(--noir); box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .btn-google svg { flex-shrink: 0; }
    button:disabled { opacity: .6; cursor: wait; transform: none; }
    .message { margin: 2px 4px 0; font-size: .92rem; line-height: 1.4; text-align: center; }
    .message[hidden] { display: none; }
    .message.erreur { color: #c81e1e; }
    .message.ok { color: #15803d; }
    .bascule { max-width: 460px; margin: 26px auto 0; font-size: .95rem; color: #666; }
    button.lien { background: none; color: var(--noir); padding: 0; font-weight: 700; font-size: inherit; text-decoration: underline; border-radius: 0; transition: none; }
    button.lien:hover { transform: none; }

    @media (max-width: 640px) {
      .alerte { display: block; }
      main { padding-top: 170px; }
      .nav-links li:not(:last-child) { display: none; }
    }
    /* Téléphone : le bandeau rouge remonte jusque sous la barre d'état (zone du haut de l'écran) */
    @media (max-width: 640px) {
      html { background-color: #e11d2a; }
      body { background-color: #fff; padding-top: env(safe-area-inset-top, 0px); }
      .alerte { box-sizing: border-box; height: calc(32px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); line-height: 32px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="alerte">Plus que <span data-places>7</span> – capacité limitée</div>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="#fffc00"/>
          <ellipse cx="20" cy="29.5" rx="9.5" ry="3.8" fill="none" stroke="#000" stroke-width="2.3"/>
          <path d="M20 30C14.3 23.5 12.5 19.6 12.5 15.2a7.5 7.5 0 0 1 15 0c0 4.4-1.8 8.3-7.5 14.8z" fill="#000" stroke="#fffc00" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="20" cy="15.2" r="2.7" fill="#fffc00"/>
        </svg>
        <span>Flexloc<b style="color:#f5ff4f;font:inherit">.io</b></span>
      </a>
      <ul class="nav-links">
        <li><a href="connexion.html" class="nav-cta">Connexion</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <h1>Entre ton email pour <span>débloquer ta téléportation</span></h1>

    <form id="form" novalidate>
      <input type="email" name="email" placeholder="marcel@gmail.com" autocomplete="email" aria-label="Adresse e-mail" required>
      <input type="password" name="mdp" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe" required>
      <button type="submit">
        <span id="libelle">Continuer</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p class="message" id="message" role="alert" hidden></p>
    </form>

    <div class="autre">
      <p class="ou"><span>ou</span></p>
      <button type="button" class="btn-google" id="google">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Se connecter avec Google
      </button>
    </div>

    <p class="bascule"><span id="bascule-txt">Pas encore de compte ?</span> <button type="button" class="lien" id="bascule">Créer un compte</button></p>
  </main>

  <script>
    (function () {
      var form = document.getElementById('form'), msg = document.getElementById('message');
      var libelle = document.getElementById('libelle'), bascule = document.getElementById('bascule'), basculeTxt = document.getElementById('bascule-txt');
      var google = document.getElementById('google');
      var creation = false;

      // Déjà connecté (session mémorisée) : inutile de se reconnecter, on passe directement aux offres
      function dejaConnecte() {
        if (!window.flexlocAuth || !window.flexlocAuth.configure) return;
        window.flexlocAuth.email().then(function (mail) { if (mail) location.replace('offre.html'); });
      }
      if (document.readyState === 'complete') dejaConnecte(); else window.addEventListener('load', dejaConnecte);

      function afficher(texte, type) {
        msg.hidden = !texte; msg.textContent = texte || ''; msg.className = 'message' + (type ? ' ' + type : '');
      }
      function occupe(oui) {
        Array.prototype.forEach.call(document.querySelectorAll('#form button, #google'), function (b) { b.disabled = oui; });
      }
      function disponible() {
        if (window.flexlocAuth && window.flexlocAuth.configure) return true;
        afficher("La connexion n'est pas encore activée sur ce site (configuration manquante).", 'erreur');
        return false;
      }

      bascule.addEventListener('click', function () {
        creation = !creation;
        libelle.textContent = creation ? 'Créer mon compte' : 'Continuer';
        basculeTxt.textContent = creation ? 'Déjà un compte ?' : 'Pas encore de compte ?';
        bascule.textContent = creation ? 'Se connecter' : 'Créer un compte';
        form.mdp.autocomplete = creation ? 'new-password' : 'current-password';
        afficher('');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        afficher('');
        if (!form.email.value || !form.email.checkValidity()) { afficher('Entre une adresse e-mail valide.', 'erreur'); form.email.focus(); return; }
        if (!form.mdp.value) { afficher('Entre ton mot de passe.', 'erreur'); form.mdp.focus(); return; }
        if (!disponible()) return;
        occupe(true);
        var action = creation ? window.flexlocAuth.inscription : window.flexlocAuth.connexion;
        action(form.email.value.trim(), form.mdp.value).then(function (r) {
          occupe(false);
          if (r.erreur) return afficher(r.erreur, 'erreur');
          if (r.info) return afficher(r.info, 'ok');
          location.href = 'offre.html';
        });
      });

      google.addEventListener('click', function () {
        afficher('');
        if (!disponible()) return;
        occupe(true);
        window.flexlocAuth.google().then(function (r) {
          // En cas de succès, le navigateur part vers Google : on ne revient ici qu'en cas d'erreur
          if (r && r.erreur) { occupe(false); afficher(r.erreur, 'erreur'); }
        });
      });
    })();
  </script>  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="places.js"></script>
  <script src="nav.js"></script>
  <script src="abonne.js"></script>
</body>
</html>
