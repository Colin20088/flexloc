<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Flexloc.io">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e11d2a" media="(max-width: 640px)">
  <title>Flexloc – Guide d'installation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&display=swap" rel="stylesheet">
  <style>
    :root { --noir: #000; --blanc: #fff; --texte: #1a1a1f; --jaune: #f5ff4f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texte); background: var(--blanc); line-height: 1.6; min-height: 100vh; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: rgba(0,0,0,.88); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--blanc); }
    .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; letter-spacing: .5px; color: var(--blanc); text-decoration: none; }
    .nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
    .nav-links a { color: #ddd; text-decoration: none; font-size: .95rem; }
    .nav-cta { background: var(--blanc); color: var(--noir) !important; padding: 8px 18px; border-radius: 999px; font-weight: 600; }
    .alerte { display: none; background: #e11d2a; color: #fff; text-align: center; font-size: .85rem; font-weight: 700; height: 32px; line-height: 32px; }

    main { min-height: 100vh; padding: 110px 20px 80px; text-align: center; background: radial-gradient(circle at 50% 0%, #ece9ff 0%, #fff 65%); }
    .conteneur { max-width: 560px; margin: 0 auto; }
    h1 { font-family: "Inter Tight", system-ui, sans-serif; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 6px; }
    .compteur { color: #777; font-weight: 600; margin-bottom: 18px; }
    .barre { display: flex; gap: 5px; justify-content: center; margin-bottom: 22px; }
    .barre i { width: 100%; max-width: 38px; height: 5px; border-radius: 999px; background: #d3d3da; }
    .barre i.fait { background: var(--noir); }

    .etape { text-align: left; background: var(--blanc); border: 1px solid #e3e3e8; border-radius: 24px; box-shadow: 0 4px 24px rgba(0,0,0,.06); padding: 24px 22px; }
    .num { width: 44px; height: 44px; border-radius: 50%; background: var(--noir); color: var(--blanc); font-weight: 800; font-size: 1.1rem; display: grid; place-items: center; margin-bottom: 14px; }
    .etape small { display: block; color: #888; font-weight: 700; letter-spacing: .06em; font-size: .78rem; }
    .etape h2 { font-family: "Inter Tight", system-ui, sans-serif; font-weight: 800; letter-spacing: -.02em; font-size: 1.5rem; line-height: 1.2; margin: 4px 0 12px; }
    .etape p { color: #444; font-size: 1.02rem; white-space: pre-line; }
    .attention { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: #fff8dc; border: 1px solid #f0dc7a; color: #6b5200; font-size: .95rem; display: flex; gap: 10px; }
    .attention::before { content: "!"; flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #f5b301; color: #000; font-weight: 800; display: grid; place-items: center; font-size: .85rem; margin-top: 1px; }

    .nav-etapes { display: flex; gap: 10px; margin-top: 18px; }
    .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; background: var(--noir); color: var(--blanc); text-decoration: none; padding: 15px 20px; border-radius: 999px; font-weight: 700; font-size: 1rem; border: 0; cursor: pointer; font-family: inherit; }
    .btn.clair { background: var(--blanc); color: var(--noir); border: 1px solid var(--noir); }
    .btn:disabled { opacity: .35; cursor: default; }
    .lien-retour { display: inline-block; margin-top: 18px; color: #888; font-size: .95rem; text-decoration: none; }
    .lien-retour:hover { color: var(--noir); text-decoration: underline; }
    .message { color: #666; margin: 30px 0; }
    .message .btn { display: inline-flex; margin-top: 14px; flex: none; }
    [hidden] { display: none !important; }

    @media (max-width: 640px) { .alerte { display: block; } main { padding-top: 140px; } .nav-links li:not(:last-child) { display: none; } }
    @media (max-width: 640px) {
      html { background-color: #e11d2a; }
      body { background-color: #fff; }
      /* iOS récent : la couleur du haut vient de la barre fixe -> on la rend opaque (rouge) */
      nav:not(.footer-liens) { background: #e11d2a !important; -webkit-backdrop-filter: none; backdrop-filter: none; }
      nav:not(.footer-liens) .nav-inner { background: #1c1c1e; }
      .alerte { box-sizing: border-box; height: calc(32px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); line-height: 32px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="alerte">Plus que <span data-places>7</span> – capacité limitée</div>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="#fffc00"/>
          <ellipse cx="20" cy="29.5" rx="9.5" ry="3.8" fill="none" stroke="#000" stroke-width="2.3"/>
          <path d="M20 30C14.3 23.5 12.5 19.6 12.5 15.2a7.5 7.5 0 0 1 15 0c0 4.4-1.8 8.3-7.5 14.8z" fill="#000" stroke="#fffc00" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="20" cy="15.2" r="2.7" fill="#fffc00"/>
        </svg>
        <span>Flexloc<b style="color:#f5ff4f;font:inherit">.io</b></span>
      </a>
      <ul class="nav-links"><li><a href="connexion.html#connexion" class="nav-cta">Connexion</a></li></ul>
    </div>
  </nav>

  <main>
    <div class="conteneur">
      <p class="message" id="chargement">Chargement du guide…</p>

      <p class="message" id="refus" hidden>
        Le guide est réservé aux abonnés.<br>
        <a class="btn" href="offre.html">Choisir une formule</a>
      </p>

      <div id="guide" hidden>
        <h1>Pour commencer</h1>
        <p class="compteur" id="compteur"></p>
        <div class="barre" id="barre" aria-hidden="true"></div>

        <section class="etape" id="etape" aria-live="polite">
          <div class="num" id="num"></div>
          <small>ÉTAPE <span id="etape-n"></span></small>
          <h2 id="titre"></h2>
          <a class="btn" id="ouvrir-app" href="#" target="_blank" rel="noopener" hidden style="margin:0 0 16px">Ouvrir l'application</a>
          <p id="texte"></p>
          <div class="attention" id="attention" hidden></div>
        </section>

        <div class="nav-etapes">
          <button type="button" class="btn clair" id="precedent">Précédent</button>
          <button type="button" class="btn" id="suivant">Suivant</button>
        </div>
        <a class="lien-retour" href="espace.html">← Retour à Mon espace</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      // Étapes du guide (reprises de l'app)
      var ETAPES = [
        { titre: "Installe l'application Flexloc", texte: "C'est avec l'application Flexloc que tu changes ta position. Installe-la en 30 secondes :\n\n1. Touche « Ouvrir l'application » ci-dessus.\n\niPhone (avec Safari) :\n2. Touche le bouton Partager (le carré avec une flèche vers le haut, en bas de l'écran ; parfois derrière les trois points « … »).\n3. Fais défiler et touche « Sur l'écran d'accueil », puis « Ajouter » en haut à droite.\n\nAndroid (avec Chrome) :\n2. Touche les trois points « ⋮ » en haut à droite.\n3. Touche « Ajouter à l'écran d'accueil » (ou « Installer l'application »), puis confirme avec « Ajouter ».\n\nL'icône apparaît sur ton écran d'accueil : ouvre-la pour choisir ta ville et te téléporter." }
      ];

      var el = function (id) { return document.getElementById(id); };
      var index = 0;
      try { var memo = parseInt(sessionStorage.getItem('flexloc_guide_etape'), 10); if (memo >= 0 && memo < ETAPES.length) index = memo; } catch (e) {}

      function afficher() {
        var e = ETAPES[index];
        el('num').textContent = index + 1;
        el('etape-n').textContent = index + 1;
        el('titre').textContent = e.titre;
        el('texte').textContent = e.texte;
        el('attention').hidden = !e.attention;
        el('attention').textContent = e.attention || '';
        el('compteur').textContent = (index + 1) + ' / ' + ETAPES.length;
        el('precedent').disabled = index === 0;
        el('suivant').textContent = ETAPES.length === 1 ? "C'est fait" : (index === ETAPES.length - 1 ? 'Terminer' : 'Suivant');
        Array.prototype.forEach.call(el('barre').children, function (b, i) { b.className = i <= index ? 'fait' : ''; });
        try { sessionStorage.setItem('flexloc_guide_etape', String(index)); } catch (er) {}
      }

      ETAPES.forEach(function () { el('barre').appendChild(document.createElement('i')); });
      // Une seule étape : pas de compteur, de barre ni de bouton « Précédent »
      if (ETAPES.length === 1) {
        el('compteur').hidden = true; el('barre').hidden = true; el('precedent').hidden = true;
        el('etape-n').parentNode.hidden = true;   // « ÉTAPE 1 »
        el('num').hidden = true;
      }
      el('precedent').addEventListener('click', function () { if (index > 0) { index--; afficher(); window.scrollTo(0, 0); } });
      el('suivant').addEventListener('click', function () {
        if (index < ETAPES.length - 1) { index++; afficher(); window.scrollTo(0, 0); }
        else { location.href = 'espace.html'; }
      });

      // Réservé aux abonnés : on vérifie le compte connecté et son abonnement
      function actif(a) {
        return a.offre !== 'pack' && a.offre !== 'illimite' && a.offre !== 'indetectable' && (a.status === 'active' || a.status === 'trialing' ||
          (a.cancel_at_period_end && a.current_period_end && new Date(a.current_period_end) > new Date()));
      }
      function demarrer() {
        var auth = window.flexlocAuth;
        if (!auth || !auth.configure) { el('chargement').textContent = "La connexion n'est pas configurée."; return; }
        auth.espace().then(function (r) {
          el('chargement').hidden = true;
          if (!r.connecte) { location.replace('connexion.html#connexion'); return; }
          if (r.erreur || !(r.abonnements || []).some(actif)) { el('refus').hidden = false; return; }
          // Lien vers l'application (adresse définie dans config.js)
          var cfg = window.FLEXLOC_SUPABASE || {};
          if (cfg.appUrl) { el('ouvrir-app').href = cfg.appUrl; el('ouvrir-app').hidden = false; }
          afficher();
          el('guide').hidden = false;
        });
      }
      if (document.readyState === 'complete') demarrer(); else window.addEventListener('load', demarrer);
    })();
  </script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="places.js"></script>
  <script src="nav.js"></script>
  <script src="abonne.js"></script>
</body>
</html>
